name: Batch compression
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU build
        run: cmake -S . -B build -DBATCH_CUDA=OFF -DLIGRA=OFF -DGUNROCK=OFF
      - name: Build
        run: cmake --build build -j 2
      - name: Test exactness and file compatibility
        run: ctest --test-dir build --output-on-failure
